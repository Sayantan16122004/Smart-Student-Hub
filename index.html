<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            text-align: center;
        }
        .buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }
        .buttons input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .buttons p {
            margin: 0;
            color: #007bff;
            cursor: pointer;
        }
        .container {
            width: 300px;
            padding: 60px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
        }
        .input-box {
            margin-bottom: 15px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .font-size {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Login</h1>
        <br>
        <form>
            <label class="font-size"><b>User role</b></label><br>
            <input type="radio" name="role" value="Student">
            <label>Student</label>
            <input type="radio" name="role" value="Faculty">
            <label>Faculty</label>
            <input type="radio" name="role" value="Admin">
            <label>Admin</label>
            <br><br>
            <label class="font-size"><b>User id:</b></label><br>
            <input type="text" name="username" placeholder="Enter user name" class="input-box" required><br>
            <label class="font-size"><b>Password:</b></label><br>
            <input type="password" name="password" placeholder="Enter password" class="input-box" required><br>
            <div class="buttons"><input type="submit" value="Login">
                <p>Forgot Password?</p>
            </div>
        </form>
    </div>
</body>
</html>
